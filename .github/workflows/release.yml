name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set release version
        run: mvn -B versions:set -DnewVersion="${RELEASE_TAG#v}" -DgenerateBackupPoms=false
      - name: Build and verify
        run: mvn -B clean verify
      - name: Stage immutable release assets
        run: |
          cp "target/votingplugin-control-${RELEASE_TAG#v}-all.jar" votingplugin-control.jar
          sha256sum votingplugin-control.jar > votingplugin-control.jar.sha256
      - name: Upload and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id" | head -n 1)"
          if [[ -z "$draft_id" ]]; then
            echo "::error::Create a draft GitHub release for $RELEASE_TAG before publishing the tag"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            votingplugin-control.jar votingplugin-control.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false >/dev/null
