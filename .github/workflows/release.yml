name: Publish release
run-name: Publish v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release version must be a valid version without the v prefix"
            exit 1
          fi

          release_tag="v$RELEASE_VERSION"
          releases_json="$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100"
          )"
          release_count="$(
            jq -r --arg tag "$release_tag" \
              '[.[][] | select(.tag_name == $tag)] | length' <<< "$releases_json"
          )"
          release_draft_id=""
          if [[ "$release_count" != "0" ]]; then
            release_draft_id="$(
              jq -r --arg tag "$release_tag" \
                '[.[][] | select(.tag_name == $tag and .draft == true and ((.body // "") | test("<!-- workflow-run:[0-9]+:[0-9]+ -->")))] | first | .id // empty' \
                <<< "$releases_json"
            )"
            if [[ "$release_count" != "1" || -z "$release_draft_id" ]]; then
              echo "::error::Release $release_tag already exists and is not a recoverable workflow draft"
              exit 1
            fi
            echo "::notice::Resuming workflow-owned draft release $release_draft_id"
          fi

          release_sha="$GITHUB_SHA"
          if tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" 2>/dev/null)"; then
            tag_type="$(jq -r '.object.type' <<< "$tag_json")"
            if [[ "$tag_type" != "commit" ]]; then
              echo "::error::Existing tag $release_tag is not a lightweight commit tag"
              exit 1
            fi
            release_sha="$(jq -r '.object.sha' <<< "$tag_json")"
            echo "::notice::Reusing existing tag $release_tag at $release_sha"
          fi

          {
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_SHA=$release_sha"
            echo "RELEASE_DRAFT_ID=$release_draft_id"
          } >> "$GITHUB_ENV"
      - name: Check out release source
        run: |
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            git fetch --no-tags origin "$RELEASE_SHA"
            git checkout --detach "$RELEASE_SHA"
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::Unable to check out release commit $RELEASE_SHA"
            exit 1
          fi
      - name: Set release version
        run: mvn -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
      - name: Build and verify
        run: mvn -B clean verify
      - name: Stage immutable release assets
        run: |
          cp "target/votingplugin-control-$RELEASE_VERSION-all.jar" votingplugin-control.jar
          sha256sum votingplugin-control.jar > votingplugin-control.jar.sha256
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft_id="$RELEASE_DRAFT_ID"
          release_marker="<!-- workflow-run:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT -->"

          cleanup() {
            exit_code=$?
            trap - EXIT INT TERM
            set +e

            if [[ -z "$draft_id" ]]; then
              if releases_json="$(
                gh api --paginate --slurp \
                  "repos/$GITHUB_REPOSITORY/releases?per_page=100" 2>/dev/null
              )"; then
                draft_id="$(
                  jq -r --arg tag "$RELEASE_TAG" --arg marker "$release_marker" \
                    '[.[][] | select(.tag_name == $tag and .draft == true and ((.body // "") | contains($marker)))] | first | .id // empty' \
                    <<< "$releases_json"
                )"
              fi
            fi

            if [[ -n "$draft_id" ]]; then
              if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" 2>/dev/null)"; then
                release_is_draft="$(jq -r '.draft' <<< "$release_json")"
                if [[ "$release_is_draft" == "true" ]]; then
                  gh api --method DELETE \
                    "repos/$GITHUB_REPOSITORY/releases/$draft_id" >/dev/null
                fi
              fi
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null)"; then
            current_type="$(jq -r '.object.type' <<< "$tag_json")"
            current_sha="$(jq -r '.object.sha' <<< "$tag_json")"
            if [[ "$current_type" != "commit" || "$current_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Release tag no longer points at the verified commit"
              false
            fi
          else
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" \
                -f sha="$RELEASE_SHA" >/dev/null; then
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
              current_type="$(jq -r '.object.type' <<< "$tag_json")"
              current_sha="$(jq -r '.object.sha' <<< "$tag_json")"
              if [[ "$current_type" != "commit" || "$current_sha" != "$RELEASE_SHA" ]]; then
                echo "::error::Release tag was concurrently created at another commit"
                false
              fi
            fi
          fi

          if [[ -n "$draft_id" ]]; then
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
            release_is_draft="$(jq -r '.draft' <<< "$release_json")"
            release_tag_name="$(jq -r '.tag_name' <<< "$release_json")"
            if [[ "$release_is_draft" != "true" || "$release_tag_name" != "$RELEASE_TAG" ]]; then
              echo "::error::Recoverable draft changed while the release was building"
              false
            fi
          else
            draft_id="$(
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$RELEASE_TAG" \
                -f name="$RELEASE_TAG" \
                -f body="$release_marker" \
                -F draft=true \
                -F generate_release_notes=true \
                --jq '.id'
            )"
            if [[ -z "$draft_id" ]]; then
              echo "::error::Created draft release did not return an ID"
              false
            fi
          fi

          gh release upload "$RELEASE_TAG" \
            votingplugin-control.jar votingplugin-control.jar.sha256 \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          current_type="$(jq -r '.object.type' <<< "$tag_json")"
          current_sha="$(jq -r '.object.sha' <<< "$tag_json")"
          if [[ "$current_type" != "commit" || "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag changed after the verified build"
            false
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false >/dev/null
          draft_id=""
          trap - EXIT INT TERM
