name: Publish release
run-name: Publish v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release version must be a valid version without the v prefix"
            exit 1
          fi
          release_tag="v$RELEASE_VERSION"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            echo "::error::Release or tag $release_tag already exists"
            exit 1
          fi
          {
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "RELEASE_TAG=$release_tag"
          } >> "$GITHUB_ENV"
      - name: Set release version
        run: mvn -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
      - name: Build and verify
        run: mvn -B clean verify
      - name: Stage immutable release assets
        run: |
          cp "target/votingplugin-control-$RELEASE_VERSION-all.jar" votingplugin-control.jar
          sha256sum votingplugin-control.jar > votingplugin-control.jar.sha256
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft_id=""
          tag_created=false
          release_marker="<!-- workflow-run:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT -->"

          cleanup() {
            exit_code=$?
            trap - EXIT INT TERM
            set +e

            release_state=missing
            if [[ -z "$draft_id" ]]; then
              draft_lookup="$(
                gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                  --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true and ((.body // \"\") | contains(\"$release_marker\"))) | .id" \
                  2>/dev/null
              )"
              lookup_status=$?
              if [[ "$lookup_status" -ne 0 ]]; then
                release_state=unknown
              else
                draft_id="$(head -n 1 <<< "$draft_lookup")"
              fi
            fi

            if [[ -n "$draft_id" ]]; then
              if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" 2>/dev/null)"; then
                release_is_draft="$(jq -r '.draft' <<< "$release_json")"
                if [[ "$release_is_draft" == "true" ]]; then
                  if gh api --method DELETE \
                      "repos/$GITHUB_REPOSITORY/releases/$draft_id" >/dev/null; then
                    release_state=removed
                  else
                    release_state=unknown
                  fi
                else
                  release_state=published
                fi
              else
                release_state=unknown
              fi
            fi

            if [[ "$tag_created" == "true" \
                && ( "$release_state" == "missing" || "$release_state" == "removed" ) ]]; then
              if releases_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" 2>/dev/null)"; then
                releases_for_tag="$(
                  jq -r --arg tag "$RELEASE_TAG" \
                    '[.[] | select(.tag_name == $tag)] | length' <<< "$releases_json"
                )"
                if [[ "$releases_for_tag" == "0" ]]; then
                  current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
                    --jq '.object.sha' 2>/dev/null)"
                  if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
                    gh api --method DELETE \
                      "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" >/dev/null
                  fi
                fi
              fi
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA" >/dev/null
          tag_created=true

          draft_id="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f name="$RELEASE_TAG" \
              -f body="$release_marker" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq '.id'
          )"
          if [[ -z "$draft_id" ]]; then
            echo "::error::Created draft release did not return an ID"
            false
          fi

          gh release upload "$RELEASE_TAG" \
            votingplugin-control.jar votingplugin-control.jar.sha256 \
            --repo "$GITHUB_REPOSITORY"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag changed after the verified build"
            false
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false >/dev/null
          tag_created=false
          draft_id=""
          trap - EXIT INT TERM
