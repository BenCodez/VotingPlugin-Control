name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set release version
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Build and verify
        run: mvn -B clean verify
      - name: Stage immutable release assets
        run: |
          cp "target/votingplugin-control-${GITHUB_REF_NAME#v}-all.jar" votingplugin-control.jar
          sha256sum votingplugin-control.jar > votingplugin-control.jar.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          votingplugin-control.jar votingplugin-control.jar.sha256
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
