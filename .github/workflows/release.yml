name: Publish release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set release version
        run: mvn -B versions:set -DnewVersion="${RELEASE_TAG#v}" -DgenerateBackupPoms=false
      - name: Build and verify
        run: mvn -B clean verify
      - name: Stage immutable release assets
        run: |
          cp "target/votingplugin-control-${RELEASE_TAG#v}-all.jar" votingplugin-control.jar
          sha256sum votingplugin-control.jar > votingplugin-control.jar.sha256
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          votingplugin-control.jar votingplugin-control.jar.sha256
          --repo "$GITHUB_REPOSITORY"
          --clobber
