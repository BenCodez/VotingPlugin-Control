name: Publish release
run-name: Publish v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release version must be a valid version without the v prefix"
            exit 1
          fi
          release_tag="v$RELEASE_VERSION"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            echo "::error::Release or tag $release_tag already exists"
            exit 1
          fi
          {
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "RELEASE_TAG=$release_tag"
          } >> "$GITHUB_ENV"
      - name: Set release version
        run: mvn -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
      - name: Build and verify
        run: mvn -B clean verify
      - name: Stage immutable release assets
        run: |
          cp "target/votingplugin-control-$RELEASE_VERSION-all.jar" votingplugin-control.jar
          sha256sum votingplugin-control.jar > votingplugin-control.jar.sha256
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft_id=""
          tag_created=false
          cleanup() {
            exit_code=$?
            trap - ERR
            set +e
            if [[ -n "$draft_id" ]]; then
              release_is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.draft' 2>/dev/null)"
              if [[ "$release_is_draft" == "true" ]]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$draft_id" >/dev/null
              elif [[ "$release_is_draft" == "false" ]]; then
                tag_created=false
              fi
            fi
            if [[ "$tag_created" == "true" ]]; then
              current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
                --jq '.object.sha' 2>/dev/null)"
              if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" >/dev/null
              fi
            fi
            exit "$exit_code"
          }
          trap cleanup ERR

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA" >/dev/null
          tag_created=true

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TAG" \
            --generate-notes
          draft_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id" | head -n 1)"
          if [[ -z "$draft_id" ]]; then
            echo "::error::Created draft release could not be identified"
            false
          fi

          gh release upload "$RELEASE_TAG" \
            votingplugin-control.jar votingplugin-control.jar.sha256 \
            --repo "$GITHUB_REPOSITORY"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag changed after the verified build"
            false
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false >/dev/null
          tag_created=false
          draft_id=""
          trap - ERR
